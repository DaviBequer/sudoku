<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sudoku</title>
<meta name="description" content="Sudoku minimalista com rascunho, desafios e leitura por foto.">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
<style>
:root{
  --bg:#f6f6f4; --surface:#ffffff; --text:#18181b; --muted:#8a8a93; --faint:#ededeb;
  --line:#e7e7e4; --box:#bdbdb8; --accent:#4c6ef5; --accent-soft:#e3e9ff; --accent-softer:#f1f4ff;
  --peer:#f6f6f4; --hint:#e3a008; --hint-soft:#fff5d9; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111113; --surface:#1b1b1e; --text:#ededef; --muted:#85858e; --faint:#26262a;
    --line:#2a2a2f; --box:#56565e; --accent:#7d95ff; --accent-soft:#283463; --accent-softer:#1e2442;
    --peer:#202024; --hint:#f0b429; --hint-soft:#3a3115; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
main{max-width:540px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 28px}
main.wide{max-width:800px}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;user-select:none;-webkit-user-select:none}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.bar{display:flex;align-items:center;justify-content:space-between;height:56px;gap:8px}
.bar h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:32px;height:32px}
.icon{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.icon:hover{background:var(--faint)}
.icon.ghost{color:var(--muted)}
.row{display:flex;gap:4px;align-items:center}

.btn{height:48px;padding:0 20px;border-radius:14px;background:var(--faint);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--text);color:var(--bg)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}

.seg{display:flex;background:var(--faint);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

.track{height:6px;border-radius:3px;background:var(--faint);overflow:hidden;flex:1}
.track>div{height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .35s ease}
.prog{display:flex;align-items:center;gap:12px;margin:22px 0 14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog b{color:var(--text);font-weight:600}

.continue{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border-radius:18px;padding:14px 16px;margin:6px 0 8px;box-shadow:var(--shadow)}
.continue .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.continue small{color:var(--muted);font-size:12px}
.continue strong{font-weight:600;font-size:15px}
.continue .play{width:40px;height:40px;border-radius:50%;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;border-radius:14px;background:var(--surface);font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:var(--shadow)}
.tile.done{background:var(--accent);color:#fff}
.tile.assisted{background:var(--accent-soft);color:var(--accent)}
.tile .tp{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.tile.big{aspect-ratio:auto;height:72px;grid-column:span 2}

/* ---------- jogo ---------- */
.gtitle{flex:1;text-align:center;display:flex;flex-direction:column;line-height:1.25}
.gtitle strong{font-size:15px;font-weight:600}
.gtitle span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.gprog{display:flex;align-items:center;gap:10px;margin:2px 0 12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.gprog span{width:34px;text-align:right}

.board{--n:9;--b:3;container-type:inline-size;display:grid;grid-template-columns:repeat(var(--n),1fr);width:100%;max-width:520px;aspect-ratio:1;margin:0 auto;background:var(--surface);border:1.5px solid var(--box);border-radius:14px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
main.wide .board{max-width:760px}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:calc(100cqw / var(--n) * .5);font-weight:400;cursor:pointer;line-height:1;transition:background .12s}
.cell.bR{border-right:1.5px solid var(--box)}
.cell.bB{border-bottom:1.5px solid var(--box)}
.cell.lc{border-right:0}
.cell.lr{border-bottom:0}
.cell.given{font-weight:600}
.cell.user{color:var(--accent);font-weight:500}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--accent-softer)}
.cell.harea{background:var(--hint-soft)}
.cell.selected{background:var(--accent-soft)}
.cell.hfocus{box-shadow:inset 0 0 0 2px var(--hint)}
.cell.warn{background:var(--hint-soft)}
.cell.dup{box-shadow:inset 0 0 0 2px var(--hint)}
.notes{position:absolute;inset:1px;display:grid;grid-template-columns:repeat(var(--b),1fr);grid-template-rows:repeat(var(--b),1fr);font-size:calc(100cqw / var(--n) / var(--b) * .78);color:var(--muted);font-weight:500}
.notes span{display:flex;align-items:center;justify-content:center}
.notes span.hl{color:var(--accent);font-weight:700}

.hintcard{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:16px;padding:12px 8px 12px 16px;margin:12px auto 0;max-width:520px;box-shadow:var(--shadow);font-size:14px;line-height:1.5;border-left:3px solid var(--hint)}
.hintcard>div{flex:1}
.hintcard p{margin:0 0 6px}.hintcard p:last-child{margin:0}
.hintcard .icon{width:32px;height:32px;color:var(--muted)}

.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:520px;margin:14px auto 0}
.tool{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;font-size:11px;color:var(--muted);border-radius:12px}
.tool .ib{width:46px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .15s,color .15s}
.tool:active .ib{background:var(--faint)}
.tool.on .ib{background:var(--text);color:var(--bg)}
.tool.on{color:var(--text)}
.switch{width:38px;height:22px;border-radius:11px;background:var(--box);position:relative;transition:background .2s;margin:8px 0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.tool.sw.on .switch{background:var(--accent)}
.tool.sw.on .switch::after{transform:translateX(16px)}
.tool.sw.on{color:var(--text)}

.pad{--pc:9;display:grid;grid-template-columns:repeat(var(--pc),1fr);gap:6px;max-width:520px;margin:10px auto 0}
main.wide .pad{max-width:640px}
.pad button{height:54px;border-radius:12px;background:var(--surface);font-size:24px;font-weight:500;box-shadow:var(--shadow);transition:transform .08s}
.pad button:active{transform:scale(.94)}
.pad.dense button{height:44px;font-size:18px}
.pad.notes button{color:var(--accent);font-size:17px;font-weight:600}
.pad.dense.notes button{font-size:14px}

/* ---------- sobreposições ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.38);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .15s}
.scrim.center{align-items:center;padding:16px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet{width:100%;max-width:540px;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 10px max(14px,env(safe-area-inset-bottom));animation:up .2s ease}
.grab{width:36px;height:4px;border-radius:2px;background:var(--box);margin:4px auto 10px}
.item{width:100%;display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;text-align:left}
.item:hover{background:var(--faint)}
.item .ib{width:40px;height:40px;border-radius:12px;background:var(--faint);display:flex;align-items:center;justify-content:center}
.item b{display:block;font-weight:600;font-size:15px}
.item span{font-size:13px;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:6px 12px}
.dialog{background:var(--surface);border-radius:22px;padding:26px 22px 20px;max-width:340px;width:100%;text-align:center;animation:up .2s ease}
.dialog h2{margin:10px 0 4px;font-size:21px;letter-spacing:-.01em}
.dialog p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5}
.dialog .row{gap:8px}.dialog .row .btn{flex:1}
.done-ic{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.done-ic svg.ic{width:28px;height:28px;stroke-width:2.4}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{flex-direction:column;gap:14px;color:#fff;font-size:14px;align-items:center}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:20}
.toast.show{opacity:1}

/* ---------- câmera ---------- */
.cam{position:fixed;inset:0;background:#000;z-index:30;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-guide{position:relative;width:min(86vw,64vh);aspect-ratio:1;border-radius:18px;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.cam-tip{position:absolute;top:max(24px,env(safe-area-inset-top));left:0;right:0;margin:0;text-align:center;color:#fff;font-size:14px}
.cam-bar{position:absolute;left:0;right:0;bottom:max(28px,env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center}
.cam-btn{color:#fff;background:rgba(255,255,255,.14)}
.cam-btn:hover{background:rgba(255,255,255,.24)}
.shutter{width:70px;height:70px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #000,0 0 0 7px #fff;transition:transform .1s}
.shutter:active{transform:scale(.92)}

/* ---------- foto ---------- */
.sub{color:var(--muted);font-size:14px;margin:0 0 12px;line-height:1.5}
#cropCanvas{display:block;margin:0 auto;max-width:100%;max-height:60vh;touch-action:none;border-radius:14px;background:#000}
.status{font-size:13px;color:var(--muted);min-height:20px;margin:10px 0}
.thumb{display:block;width:min(100%,220px);margin:16px auto 0;border-radius:10px}
.mini{display:flex;gap:8px;margin-top:10px}
.mini .btn{flex:1;height:42px;font-size:14px;font-weight:500}
</style>
</head>
<body>
<main id="main">

<!-- INÍCIO -->
<section id="home">
  <header class="bar">
    <h1 class="brand"><img src="icon.svg" alt="">Sudoku</h1>
    <div class="row">
      <button class="icon" id="btnInstall" title="Instalar app" hidden><i data-i="download"></i></button>
      <button class="icon" id="btnPhoto" title="Fotografar um sudoku"><i data-i="camera"></i></button>
      <button class="icon" id="btnManual" title="Digitar um sudoku"><i data-i="grid"></i></button>
    </div>
  </header>
  <button class="continue" id="continueCard" hidden>
    <div class="t"><small>Continuar</small><strong id="ccTitle"></strong><div class="track"><div id="ccFill"></div></div></div>
    <div class="play"><i data-i="play"></i></div>
  </button>
  <div class="seg" id="segSize"><button data-v="9">9×9</button><button data-v="16">16×16</button><button data-v="25">25×25</button></div>
  <div class="seg" id="segDiff"><button data-v="0">Fácil</button><button data-v="1">Médio</button><button data-v="2">Difícil</button></div>
  <div class="prog"><div class="track"><div id="ovFill"></div></div><span id="ovText"></span></div>
  <div class="tiles" id="tiles"></div>
</section>

<!-- JOGO -->
<section id="game" hidden>
  <header class="bar">
    <button class="icon" id="gBack" title="Voltar"><i data-i="back"></i></button>
    <div class="gtitle"><strong id="gTitle"></strong><span id="gSub"></span></div>
    <button class="icon ghost" id="gMore" title="Mais"><i data-i="more"></i></button>
  </header>
  <div class="gprog"><div class="track"><div id="gFill"></div></div><span id="gPct">0%</span></div>
  <div class="board" id="board"></div>
  <div class="hintcard" id="hintCard" hidden><div id="hintText"></div><button class="icon" id="hintClose"><i data-i="x"></i></button></div>
  <div class="tools">
    <button class="tool" id="tUndo"><span class="ib"><i data-i="undo"></i></span>Desfazer</button>
    <button class="tool" id="tErase"><span class="ib"><i data-i="eraser"></i></span>Apagar</button>
    <button class="tool" id="tNotes"><span class="ib"><i data-i="pencil"></i></span>Rascunho</button>
    <button class="tool sw" id="tClean"><span class="switch"></span>Auto-limpar</button>
  </div>
  <div class="pad" id="pad"></div>
</section>

<!-- RECORTE DA FOTO -->
<section id="crop" hidden>
  <header class="bar">
    <button class="icon" id="cropBack"><i data-i="back"></i></button>
    <div class="gtitle"><strong>Ajuste os cantos</strong><span>Arraste os pontos até os cantos da grade</span></div>
    <span style="width:42px"></span>
  </header>
  <canvas id="cropCanvas"></canvas>
  <div class="prog" id="ocrProgress" hidden style="margin:14px 0 0"><div class="track"><div id="ocrFill"></div></div></div>
  <div class="status" id="cropStatus"></div>
  <button class="btn primary block" id="btnRecognize">Reconhecer números</button>
</section>

<!-- CONFERÊNCIA / DIGITAÇÃO -->
<section id="review" hidden>
  <header class="bar">
    <button class="icon" id="reviewBack"><i data-i="back"></i></button>
    <div class="gtitle"><strong id="reviewTitle">Confira a grade</strong><span id="reviewSub"></span></div>
    <span style="width:42px"></span>
  </header>
  <div class="board" id="reviewBoard"></div>
  <div class="pad" id="reviewPad"></div>
  <div class="mini"><button class="btn" id="reviewErase"><i data-i="eraser"></i>Apagar</button><button class="btn" id="reviewClear"><i data-i="trash"></i>Limpar</button></div>
  <div class="status" id="reviewStatus"></div>
  <button class="btn primary block" id="btnStart">Começar</button>
  <canvas id="thumb" class="thumb" hidden></canvas>
</section>

</main>

<input id="fileInput" type="file" accept="image/*" capture="environment" hidden>

<div class="cam" id="camera" hidden>
  <video id="camVideo" playsinline muted autoplay></video>
  <div class="cam-guide"></div>
  <p class="cam-tip">Enquadre a grade dentro do quadrado</p>
  <div class="cam-bar">
    <button class="icon cam-btn" id="camClose" title="Fechar"><i data-i="x"></i></button>
    <button class="shutter" id="camShot" title="Tirar foto"></button>
    <span style="width:42px"></span>
  </div>
</div>

<div class="scrim" id="sheet" hidden>
  <div class="sheet">
    <div class="grab"></div>
    <button class="item" id="hThink"><span class="ib"><i data-i="bulb"></i></span><div><b>Como pensar</b><span>Explica o próximo raciocínio</span></div></button>
    <button class="item" id="hReveal"><span class="ib"><i data-i="eye"></i></span><div><b>Mostrar um número</b><span>Preenche a casa selecionada</span></div></button>
    <button class="item" id="hNotes"><span class="ib"><i data-i="notes"></i></span><div><b>Preencher rascunho</b><span>Anota todos os candidatos possíveis</span></div></button>
    <div class="sep"></div>
    <button class="item" id="hSolve"><span class="ib"><i data-i="wand"></i></span><div><b>Resolver</b><span>Mostra a solução completa</span></div></button>
    <button class="item" id="hRestart"><span class="ib"><i data-i="restart"></i></span><div><b>Recomeçar</b><span>Apaga o progresso deste jogo</span></div></button>
  </div>
</div>

<div class="scrim center" id="doneDlg" hidden>
  <div class="dialog">
    <div class="done-ic"><i data-i="check"></i></div>
    <h2 id="doneTitle">Concluído</h2>
    <p id="doneText"></p>
    <div class="row"><button class="btn" id="doneHome">Início</button><button class="btn primary" id="doneNext">Próximo</button></div>
  </div>
</div>

<div class="scrim center" id="askDlg" hidden>
  <div class="dialog">
    <p id="askText" style="color:var(--text);font-size:15px"></p>
    <div class="row"><button class="btn" id="askCancel">Cancelar</button><button class="btn primary" id="askOk">Confirmar</button></div>
  </div>
</div>

<div class="scrim center loading" id="loading" hidden><div class="spinner"></div><span>Gerando desafio…</span></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);

// ---------- Ícones ----------
const ICONS = {
  back: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
  grid: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>',
  play: '<path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/>',
  more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  eraser: '<path d="m7 21-4.3-4.3a2.4 2.4 0 0 1 0-3.4l9.6-9.6a2.4 2.4 0 0 1 3.4 0l5.6 5.6a2.4 2.4 0 0 1 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/>',
  pencil: '<path d="M21.2 6.8a2.8 2.8 0 0 0-4-4L3.8 16.2a2 2 0 0 0-.5.8l-1.3 4.4a.5.5 0 0 0 .6.6l4.4-1.3a2 2 0 0 0 .8-.5z"/><path d="m15 5 4 4"/>',
  bulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  notes: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01"/>',
  wand: '<path d="m21.6 3.6-1.2-1.2a1.2 1.2 0 0 0-1.7 0L2.4 18.6a1.2 1.2 0 0 0 0 1.7l1.2 1.2a1.2 1.2 0 0 0 1.7 0L21.6 5.4a1.2 1.2 0 0 0 0-1.8z"/><path d="m14 7 3 3"/><path d="M5 6v4M19 14v4M10 2v2M7 8H3M21 16h-4M11 3H9"/>',
  restart: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',

// ---------- Geometria do tabuleiro (n = 9, 16, 25) ----------
const GEO = {};
function geo(n) {
  if (GEO[n]) return GEO[n];
  const b = Math.round(Math.sqrt(n)), N = n * n, rows = [], cols = [], boxes = [], boxOf = new Int16Array(N);
  for (let k = 0; k < n; k++) { rows.push([]); cols.push([]); boxes.push([]); }
  for (let i = 0; i < N; i++) {
    const r = i / n | 0, c = i % n, bx = (r / b | 0) * b + (c / b | 0);
    rows[r].push(i); cols[c].push(i); boxes[bx].push(i); boxOf[i] = bx;
  }
  const peers = [];
  for (let i = 0; i < N; i++) {
    const s = new Set([...rows[i / n | 0], ...cols[i % n], ...boxes[boxOf[i]]]); s.delete(i);
    peers.push(Int16Array.from(s));
  }
  return GEO[n] = { n, b, N, rows, cols, boxes, boxOf, peers, units: [...rows, ...cols, ...boxes], full: (1 << n) - 1 };
}
const bitD = m => 32 - Math.clz32(m); // bit único -> dígito (1..n)
function pc(m) { m = m - ((m >>> 1) & 0x55555555); m = (m & 0x33333333) + ((m >>> 2) & 0x33333333); return (((m + (m >>> 4)) & 0x0F0F0F0F) * 0x01010101) >>> 24; }
function initCands(g, vals) {
  const c = new Int32Array(g.N);
  for (let i = 0; i < g.N; i++) if (!vals[i]) {
    let m = g.full;
    for (const p of g.peers[i]) if (vals[p]) m &= ~(1 << (vals[p] - 1));
    c[i] = m;
  }
  return c;
}
function place(g, vals, cand, i, d) {
  vals[i] = d; cand[i] = 0;
  const bit = 1 << (d - 1);
  for (const p of g.peers[i]) cand[p] &= ~bit;
}
function conflicts(g, vals) {
  const out = new Set();
  for (let i = 0; i < g.N; i++) if (vals[i]) for (const p of g.peers[i]) if (vals[p] === vals[i]) { out.add(i); break; }
  return out;
}

// ---------- Técnicas lógicas (usadas no gerador e nas dicas) ----------
function unitOrder(g) { const o = []; for (let u = 2 * g.n; u < 3 * g.n; u++) o.push(u); for (let u = 0; u < 2 * g.n; u++) o.push(u); return o; }
function hiddenInUnit(g, vals, cand, u) {
  const unit = g.units[u];
  let once = 0, twice = 0, placed = 0;
  for (const i of unit) { if (vals[i]) placed |= 1 << (vals[i] - 1); else { twice |= once & cand[i]; once |= cand[i]; } }
  const ex = once & ~twice & ~placed;
  if (!ex) return null;
  const bit = ex & -ex;
  for (const i of unit) if (!vals[i] && (cand[i] & bit)) return { k: 'hidden', u, i, d: bitD(bit), place: [i, bitD(bit)], focus: [i], area: unit };
  return null;
}
function stepHidden(g, vals, cand) {
  for (const u of unitOrder(g)) { const s = hiddenInUnit(g, vals, cand, u); if (s) return s; }
  return null;
}
function stepNaked(g, vals, cand) {
  for (let i = 0; i < g.N; i++) if (!vals[i] && cand[i] && !(cand[i] & (cand[i] - 1)))
    return { k: 'naked', i, d: bitD(cand[i]), place: [i, bitD(cand[i])], focus: [i], area: [] };
  return null;
}
function singleAt(g, vals, cand, i) {
  if (i < 0 || vals[i]) return null;
  const n = g.n;
  for (const u of [2 * n + g.boxOf[i], i / n | 0, n + i % n]) {
    const s = hiddenInUnit(g, vals, cand, u);
    if (s && s.i === i) return s;
  }
  if (cand[i] && !(cand[i] & (cand[i] - 1))) return { k: 'naked', i, d: bitD(cand[i]), place: [i, bitD(cand[i])], focus: [i], area: [] };
  return null;
}
function stepPointing(g, vals, cand) {
  const { n, boxes, rows, cols, boxOf } = g;
  for (let bx = 0; bx < n; bx++) for (let d = 1; d <= n; d++) {
    const bit = 1 << (d - 1), cells = boxes[bx].filter(i => !vals[i] && (cand[i] & bit));
    if (cells.length < 2) continue;
    const r0 = cells[0] / n | 0, c0 = cells[0] % n;
    for (const [isRow, li, line] of [[true, r0, rows[r0]], [false, c0, cols[c0]]]) {
      if (!cells.every(i => isRow ? (i / n | 0) === li : i % n === li)) continue;
      const elim = line.filter(i => boxOf[i] !== bx && !vals[i] && (cand[i] & bit));
      if (elim.length) return { k: 'pointing', level: 2, bx, line: isRow ? 'linha' : 'coluna', li, d, elim: elim.map(i => [i, bit]), focus: cells, area: line.concat(boxes[bx]) };
    }
  }
  return null;
}
function stepClaiming(g, vals, cand) {
  const { n, boxes, boxOf } = g;
  for (let u = 0; u < 2 * n; u++) for (let d = 1; d <= n; d++) {
    const bit = 1 << (d - 1), line = g.units[u], cells = line.filter(i => !vals[i] && (cand[i] & bit));
    if (cells.length < 2) continue;
    const bx = boxOf[cells[0]];
    if (!cells.every(i => boxOf[i] === bx)) continue;
    const elim = boxes[bx].filter(i => !line.includes(i) && !vals[i] && (cand[i] & bit));
    if (elim.length) return { k: 'claim', level: 2, bx, line: u < n ? 'linha' : 'coluna', li: u % n, d, elim: elim.map(i => [i, bit]), focus: cells, area: boxes[bx].concat(line) };
  }
  return null;
}
function stepNakedPair(g, vals, cand) {
  for (let u = 0; u < g.units.length; u++) {
    const unit = g.units[u], seen = new Map();
    for (const i of unit) {
      if (vals[i] || pc(cand[i]) !== 2) continue;
      const j = seen.get(cand[i]);
      if (j === undefined) { seen.set(cand[i], i); continue; }
      const m = cand[i], elim = unit.filter(k => k !== i && k !== j && !vals[k] && (cand[k] & m)).map(k => [k, m]);
      if (elim.length) return { k: 'npair', level: 3, u, cells: [j, i], ds: [bitD(m & -m), bitD(m & ~(m & -m))], elim, focus: [j, i], area: unit };
    }
  }
  return null;
}
function stepHiddenPair(g, vals, cand) {
  const n = g.n;
  for (let u = 0; u < g.units.length; u++) {
    const unit = g.units[u], posOf = new Array(n + 1).fill(0);
    for (let k = 0; k < n; k++) { const i = unit[k]; if (vals[i]) continue; for (let d = 1; d <= n; d++) if (cand[i] & (1 << (d - 1))) posOf[d] |= 1 << k; }
    for (let a = 1; a <= n; a++) {
      if (pc(posOf[a]) !== 2) continue;
      for (let b = a + 1; b <= n; b++) {
        if (posOf[b] !== posOf[a]) continue;
        const keep = (1 << (a - 1)) | (1 << (b - 1)), p = posOf[a];
        const cells = [unit[bitD(p & -p) - 1], unit[bitD(p & ~(p & -p)) - 1]];
        const elim = cells.filter(i => cand[i] & ~keep).map(i => [i, cand[i] & ~keep]);
        if (elim.length) return { k: 'hpair', level: 3, u, cells, ds: [a, b], elim, focus: cells, area: unit };
      }
    }
  }
  return null;
}
function findStep(g, vals, cand, prefer) {
  return singleAt(g, vals, cand, prefer) || stepHidden(g, vals, cand) || stepNaked(g, vals, cand)
    || stepPointing(g, vals, cand) || stepClaiming(g, vals, cand) || stepNakedPair(g, vals, cand) || stepHiddenPair(g, vals, cand);
}
function applyElim(cand, elim) { for (const [i, m] of elim) cand[i] &= ~m; }

// Resolve só com lógica (sem chutes) — garante solução única e mede a dificuldade.
function logicSolve(g, givens, level) {
  const vals = Int8Array.from(givens), cand = initCands(g, vals);
  let empty = 0; for (const v of vals) if (!v) empty++;
  while (empty > 0) {
    let prog = 0;
    for (let i = 0; i < g.N; i++) if (!vals[i]) {
      const m = cand[i];
      if (!m) return false;
      if (!(m & (m - 1))) { place(g, vals, cand, i, bitD(m)); empty--; prog++; }
    }
    for (const unit of g.units) {
      let once = 0, twice = 0, placed = 0;
      for (const i of unit) { if (vals[i]) placed |= 1 << (vals[i] - 1); else { twice |= once & cand[i]; once |= cand[i]; } }
      let ex = once & ~twice & ~placed;
      while (ex) {
        const bit = ex & -ex; ex ^= bit;
        for (const i of unit) if (!vals[i] && (cand[i] & bit)) { place(g, vals, cand, i, bitD(bit)); empty--; prog++; break; }
      }
    }
    if (prog) continue;
    if (level < 2) return false;
    const s = stepPointing(g, vals, cand) || stepClaiming(g, vals, cand)
      || (level >= 3 && (stepNakedPair(g, vals, cand) || stepHiddenPair(g, vals, cand)));
    if (!s) return false;
    applyElim(cand, s.elim);
  }
  return true;
}

// Backtracking (para sudokus vindos de foto/digitação)
function solveBT(g, givens) {
  const vals = Int8Array.from(givens);
  if (conflicts(g, vals).size) return null;
  const cand = initCands(g, vals);
  let steps = 0;
  function bt() {
    if (++steps > 3e5) return false;
    let best = -1, bn = 99;
    for (let i = 0; i < g.N; i++) if (!vals[i]) { const k = pc(cand[i]); if (k < bn) { bn = k; best = i; if (k <= 1) break; } }
    if (best < 0) return true;
    if (!bn) return false;
    let m = cand[best];
    while (m) {
      const bit = m & -m; m ^= bit;
      const saved = Int32Array.from(cand);
      place(g, vals, cand, best, bitD(bit));
      if (bt()) return true;
      vals[best] = 0; cand.set(saved);
    }
    return false;
  }
  return bt() ? Array.from(vals) : null;
}

// ---------- Gerador determinístico ----------
function hash(s) { let h = 2166136261 >>> 0; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(a, R) { for (let i = a.length - 1; i > 0; i--) { const j = R() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fullGrid(n, R) {
  const b = Math.round(Math.sqrt(n)), rb = [...Array(b).keys()];
  const rows = shuffle(rb.slice(), R).flatMap(x => shuffle(rb.slice(), R).map(r => x * b + r));
  const cols = shuffle(rb.slice(), R).flatMap(x => shuffle(rb.slice(), R).map(c => x * b + c));
  const nums = shuffle([...Array(n)].map((_, k) => k + 1), R), tr = R() < .5;
  const out = new Int8Array(n * n);
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const v = nums[(b * (rows[r] % b) + (rows[r] / b | 0) + cols[c]) % n];
    out[tr ? c * n + r : r * n + c] = v;
  }
  return out;
}
async function generate(n, diff, seed) {
  const g = geo(n), R = rng(seed), sol = fullGrid(n, R), puz = Int8Array.from(sol);
  const level = diff + 1, target = Math.round(g.N * FRAC[n][diff]);
  const order = shuffle([...Array(Math.ceil(g.N / 2)).keys()], R);
  let givens = g.N, k = 0;
  for (const i of order) {
    if (givens <= target) break;
    const j = g.N - 1 - i, a = puz[i], b = puz[j];
    puz[i] = 0; puz[j] = 0;
    if (logicSolve(g, puz, level)) givens -= i === j ? 1 : 2;
    else { puz[i] = a; puz[j] = b; }
    if (++k % 12 === 0) await new Promise(r => setTimeout(r));
  }
  // segunda passada: remove casas avulsas (sem simetria) até atingir o alvo
  for (const i of shuffle([...Array(g.N).keys()], R)) {
    if (givens <= target) break;
    if (!puz[i]) continue;
    const a = puz[i]; puz[i] = 0;
    if (logicSolve(g, puz, level)) givens--; else puz[i] = a;
    if (++k % 12 === 0) await new Promise(r => setTimeout(r));
  }
  return { givens: Array.from(puz), solution: Array.from(sol) };
}

// ---------- Texto das dicas ----------
function describe(g, s) {
  const n = g.n, S = d => `<b>${SYM[d - 1]}</b>`, pos = i => `linha ${(i / n | 0) + 1}, coluna ${i % n + 1}`;
  const unit = u => u < n ? { a: 'a', A: 'Na', name: `linha ${u + 1}` } : u < 2 * n ? { a: 'a', A: 'Na', name: `coluna ${u - n + 1}` } : { a: 'o', A: 'No', name: `quadrado ${u - 2 * n + 1}` };
  switch (s.k) {
    case 'naked':
      return `Olhe a casa da ${pos(s.i)}. Todos os outros números já aparecem na linha, na coluna ou no quadrado dela — só sobra o ${S(s.d)}.`;
    case 'hidden': {
      const U = unit(s.u);
      return `Olhe ${U.a} ${U.name}. O ${S(s.d)} ainda falta ali e só cabe em uma casa: ${pos(s.i)}. Nas outras casas vazias, o ${S(s.d)} já aparece na linha, na coluna ou no quadrado delas.`;
    }
    case 'pointing':
      return `No quadrado ${s.bx + 1}, o ${S(s.d)} só pode ficar na ${s.line} ${s.li + 1}. Então, fora desse quadrado, o ${S(s.d)} não pode aparecer nessa ${s.line} — risque-o do rascunho dessas casas.`;
    case 'claim':
      return `Na ${s.line} ${s.li + 1}, o ${S(s.d)} só pode ficar dentro do quadrado ${s.bx + 1}. Então, no resto desse quadrado, o ${S(s.d)} não pode aparecer — risque-o do rascunho.`;
    case 'npair': {
      const U = unit(s.u);
      return `As casas da ${pos(s.cells[0])} e da ${pos(s.cells[1])} só aceitam ${S(s.ds[0])} e ${S(s.ds[1])}. Esses dois números ficam com essas duas casas, então saem do rascunho das outras casas d${U.a} ${U.name}.`;
    }
    case 'hpair': {
      const U = unit(s.u);
      return `${U.A} ${U.name}, o ${S(s.ds[0])} e o ${S(s.ds[1])} só cabem em duas casas: ${pos(s.cells[0])} e ${pos(s.cells[1])}. Então essas casas só podem ter esses dois números — o resto do rascunho delas pode sair.`;
    }
  }
  return '';
}

// ---------- Tabuleiro (DOM) ----------
function buildBoard(el, n, onClick) {
  const b = Math.round(Math.sqrt(n));
  el.style.setProperty('--n', n); el.style.setProperty('--b', b); el.innerHTML = '';
  const cells = [];
  for (let i = 0; i < n * n; i++) {
    const d = document.createElement('div'), r = i / n | 0, c = i % n;
    let base = 'cell';
    if (c === n - 1) base += ' lc'; else if (c % b === b - 1) base += ' bR';
    if (r === n - 1) base += ' lr'; else if (r % b === b - 1) base += ' bB';
    d.className = base; d._base = base; d._html = '';
    d.addEventListener('pointerdown', e => { e.preventDefault(); onClick(i); });
    el.appendChild(d); cells.push(d);
  }
  return cells;
}
function setCell(d, cls, html) {
  const c = d._base + cls;
  if (d.className !== c) d.className = c;
  if (d._html !== html) { d.innerHTML = html; d._html = html; }
}
function buildPad(el, n, onDigit) {
  el.style.setProperty('--pc', n === 16 ? 8 : 9);
  el.classList.toggle('dense', n > 9); el.innerHTML = '';
  for (let d = 1; d <= n; d++) {
    const b = document.createElement('button'); b.textContent = SYM[d - 1];
    b.addEventListener('pointerdown', e => { e.preventDefault(); onDigit(d, e.shiftKey); });
    el.appendChild(b);
  }
}

// ---------- Início ----------
function renderHome() {
  document.querySelectorAll('#segSize button').forEach(b => b.classList.toggle('on', +b.dataset.v === settings.size));
  document.querySelectorAll('#segDiff button').forEach(b => b.classList.toggle('on', +b.dataset.v === settings.diff));
  const n = settings.size, diff = settings.diff, cnt = COUNT[n];
  let html = '', done = 0;
  for (let k = 0; k < cnt; k++) {
    const st = index[`${n}-${diff}-${k}`];
    let cls = 'tile' + (cnt === 1 ? ' big' : ''), extra = '';
    if (st && st.done) { cls += st.assisted ? ' assisted' : ' done'; if (!st.assisted) done++; }
    else if (st && st.pct > 0) extra = `<i class="tp" style="width:${st.pct}%"></i>`;
    html += `<button class="${cls}" data-k="${k}">${cnt === 1 ? 'Desafio ' : ''}${k + 1}${extra}</button>`;
  }
  $('#tiles').innerHTML = html;
  $('#ovFill').style.width = (done / cnt * 100) + '%';
  $('#ovText').innerHTML = `<b>${done}</b> de ${cnt} concluídos`;
  const last = LS.get('sdk2.last', null), st = last && index[last];
  $('#continueCard').hidden = !(st && !st.done);
  if (st && !st.done) { $('#ccTitle').textContent = `${st.title} · ${st.sub}`; $('#ccFill').style.width = st.pct + '%'; }
}
$('#segSize').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; settings.size = +b.dataset.v; saveSettings(); renderHome(); });
$('#segDiff').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; settings.diff = +b.dataset.v; saveSettings(); renderHome(); });
$('#tiles').addEventListener('click', e => { const b = e.target.closest('.tile'); if (b) openChallenge(settings.size, settings.diff, +b.dataset.k); });
$('#continueCard').addEventListener('click', () => openById(LS.get('sdk2.last', null)));

async function openChallenge(n, diff, k) {
  const id = `${n}-${diff}-${k}`;
  let p = LS.get('sdk2.p.' + id, null);
  if (!p) {
    $('#loading').hidden = false;
    try { const r = await generate(n, diff, hash(id + '#v1')); p = { g: enc(r.givens), s: enc(r.solution) }; LS.set('sdk2.p.' + id, p); }
    finally { $('#loading').hidden = true; }
  }
  startGame({ id, n, title: `${n}×${n} · ${DIFF[diff]}`, sub: COUNT[n] > 1 ? `Desafio ${k + 1}` : 'Desafio', givens: dec(p.g), sol: dec(p.s), ch: { n, diff, k } });
}
function openById(id) {
  if (!id) return;
  const m = /^(\d+)-(\d)-(\d+)$/.exec(id);
  if (m) return openChallenge(+m[1], +m[2], +m[3]);
  const p = LS.get('sdk2.p.' + id, null);
  if (p) startGame({ id, n: 9, title: p.title, sub: p.sub, givens: dec(p.g), sol: p.s ? dec(p.s) : null });
}

// ---------- Jogo ----------
let game = null, cells = [];
function startGame(o) {
  const g = geo(o.n), saved = LS.get('sdk2.g.' + o.id, null);
  game = Object.assign(o, {
    g, values: saved ? saved.values : o.givens.slice(), notes: saved ? saved.notes : new Array(g.N).fill(0),
    elapsed: saved ? saved.elapsed : 0, done: saved ? !!saved.done : false, assisted: saved ? !!saved.assisted : false,
    sel: -1, notesMode: false, history: [], hl: null,
    empties: o.givens.filter(v => !v).length,
  });
  LS.set('sdk2.last', o.id);
  show('game');

const NORM = 20;

let templates = null;
function buildTemplates() {
  templates = [];
  const fonts = ['Arial', 'Helvetica', 'Verdana', 'Georgia', 'Times New Roman', 'Tahoma', 'Trebuchet MS', 'Courier New', 'sans-serif', 'serif'];
  const c = document.createElement('canvas'); c.width = c.height = 140;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  for (const f of fonts) for (const wt of ['400', '700']) for (let dgt = 1; dgt <= 9; dgt++) {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 140, 140); ctx.fillStyle = '#000';
    ctx.font = `${wt} 100px "${f}"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(dgt), 70, 72);
    const d = ctx.getImageData(0, 0, 140, 140).data;
    let x0 = 140, y0 = 140, x1 = -1, y1 = -1;
    for (let y = 0; y < 140; y++) for (let x = 0; x < 140; x++) if (d[(y * 140 + x) * 4] < 128) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 < 0) continue;
    const m = document.createElement('canvas'); m.width = x1 - x0 + 1; m.height = y1 - y0 + 1;
    m.getContext('2d').drawImage(c, x0, y0, m.width, m.height, 0, 0, m.width, m.height);

let ocrWorker = null, ocrFailed = false;
async function getWorker() {
  if (ocrWorker || ocrFailed) return ocrWorker;
  if (!window.Tesseract) { ocrFailed = true; return null; }
  try {
    const w = await Promise.race([Tesseract.createWorker('eng'), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 30000))]);
    await w.setParameters({ tessedit_char_whitelist: '123456789', tessedit_pageseg_mode: '10' });
    ocrWorker = w;
  } catch (e) { console.warn('Tesseract indisponível:', e); ocrFailed = true; }
  return ocrWorker;
}
function ocrInput(mc) {
  const H = 48, w = Math.max(4, Math.round(mc.width * H / mc.height)), pad = 28;
  const c = document.createElement('canvas'); c.width = w + pad * 2; c.height = H + pad * 2;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(mc, pad, pad, w, H);

}
async function recognize() {
  const btn = $('#btnRecognize'), st = $('#cropStatus');
  btn.disabled = true;
  const S = 450, g = warp(S);
  const th = $('#thumb'); th.width = th.height = S;
  const tctx = th.getContext('2d'), id = tctx.createImageData(S, S);
  for (let i = 0; i < S * S; i++) { id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = g[i]; id.data[i * 4 + 3] = 255; }

  const worker = await getWorker();

    const i = filled[n], mc = digits[i];

// Números impressos da folha são parecidos entre si (altura, espessura, tom, fonte).

function filterHandwriting(digits) {
  const idx = digits.map((d, i) => d ? i : -1).filter(i => i >= 0);
  for (const i of idx) digits[i].tm = matchTemplate(digits[i]);
  const out = { count: 0, maybe: [] };
  if (idx.length < 6) return out;
  // referência = metade que mais se parece com fonte impressa (as anotações não puxam a média)
  const ref = idx.slice().sort((a, b) => digits[b].tm.score - digits[a].tm.score).slice(0, Math.max(5, Math.ceil(idx.length / 2)));
  const med = f => { const a = ref.map(f).sort((x, y) => x - y); return a[a.length >> 1]; };
  const mH = med(i => digits[i].feat.h), mC = med(i => digits[i].feat.contrast), mS = med(i => digits[i].feat.stroke);
  const mChr = med(i => digits[i].feat.chroma), mT = med(i => digits[i].tm.score);

    const f = digits[i].feat, tm = digits[i].tm;

    if (f.chroma > Math.max(45, mChr * 2.5)) strong++;               // tinta colorida (caneta azul/vermelha)
    if (f.contrast < mC * 0.6) strong++; else if (f.contrast < mC * 0.86) weak++; // lápis / tinta mais clara
